server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  - job_name: docker-containers
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 5s
    relabel_configs:
      - source_labels: ['__meta_docker_container_name']
        regex: '/(.*)'
        target_label: 'container'
      - source_labels: ['__meta_docker_container_log_stream']
        target_label: 'stream'
    pipeline_stages:
      - docker: {}
      # e-commerce services and the Recovery Controller log one JSON object per line:
      # {timestamp, service, level, event, requestId, incidentId, error}
      - match:
          selector: '{container=~"tilda-(gateway|auth|products|orders|media)|sentinel-recovery-controller|sentinel-api"}'
          stages:
            - json:
                expressions:
                  level: level
                  service: service
                  event: event
            - labels:
                level:
                service:
