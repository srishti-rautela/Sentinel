apiVersion: v1
kind: ConfigMap
metadata: { name: sentinel-urls }
data:
  AUTH_URL: http://auth-service:3001
  PRODUCT_URL: http://product-service:3002
  ORDER_URL: http://order-service:3003
  CART_URL: http://cart-service:3004
  PAYMENT_URL: http://payment-service:3005
  NOTIFICATION_URL: http://notification-service:3006
  GATEWAY_URL: http://api-gateway:3000
  INCIDENT_URL: http://incident-manager:4001
  AI_URL: http://ai-engine:4002
  POLICY_URL: http://policy-engine:4003
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
  labels: { app: api-gateway, sentinel/criticality: critical }
spec:
  replicas: 1
  selector: { matchLabels: { app: api-gateway } }
  template:
    metadata:
      labels: { app: api-gateway, sentinel/criticality: critical }
      annotations: { prometheus.io/scrape: "true", prometheus.io/port: "3000", prometheus.io/path: /metrics }
    spec:
      containers:
        - name: api-gateway
          image: sentinel/api-gateway:latest
          imagePullPolicy: IfNotPresent
          ports: [{ containerPort: 3000 }]
          envFrom: [{ configMapRef: { name: sentinel-urls } }]
          readinessProbe: { httpGet: { path: /health, port: 3000 }, periodSeconds: 5 }
          livenessProbe: { httpGet: { path: /health, port: 3000 }, initialDelaySeconds: 10, periodSeconds: 10, failureThreshold: 3 }
          resources: { requests: { cpu: 50m, memory: 64Mi }, limits: { cpu: 250m, memory: 256Mi } }
---
apiVersion: v1
kind: Service
metadata:
  name: api-gateway
spec:
  selector: { app: api-gateway }
  ports: [{ port: 3000, targetPort: 3000 }]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth-service
  labels: { app: auth-service, sentinel/criticality: critical }
spec:
  replicas: 1
  selector: { matchLabels: { app: auth-service } }
  template:
    metadata:
      labels: { app: auth-service, sentinel/criticality: critical }
      annotations: { prometheus.io/scrape: "true", prometheus.io/port: "3001", prometheus.io/path: /metrics }
    spec:
      containers:
        - name: auth-service
          image: sentinel/auth-service:latest
          imagePullPolicy: IfNotPresent
          ports: [{ containerPort: 3001 }]
          envFrom: [{ configMapRef: { name: sentinel-urls } }]
          readinessProbe: { httpGet: { path: /health, port: 3001 }, periodSeconds: 5 }
          livenessProbe: { httpGet: { path: /health, port: 3001 }, initialDelaySeconds: 10, periodSeconds: 10, failureThreshold: 3 }
          resources: { requests: { cpu: 50m, memory: 64Mi }, limits: { cpu: 250m, memory: 256Mi } }
---
apiVersion: v1
kind: Service
metadata:
  name: auth-service
spec:
  selector: { app: auth-service }
  ports: [{ port: 3001, targetPort: 3001 }]
---
